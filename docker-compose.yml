version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makeupi_store_app
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=change_to_a_secure_random_key_in_production
      - DB_PATH=/app/server/data/makeupi.db
      - UPLOAD_DIR=/app/server/uploads
      - ADMIN_DEFAULT_USER=admin
      - ADMIN_DEFAULT_PASS=admin123456
    volumes:
      - makeupi_db_data:/app/server/data
      - makeupi_uploads_data:/app/server/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  makeupi_db_data:
    driver: local
  makeupi_uploads_data:
    driver: local
